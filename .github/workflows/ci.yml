name: Сборка и проверка

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SPLITBOX_JAVA_HOME: ${{ github.workspace }}/.toolchain/jdk
      SPLITBOX_ANDROID_HOME: ${{ github.workspace }}/.toolchain/android-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Проверка исходников и скриптов выпуска
        run: |
          python3 scripts/check_repository.py
          python3 -m unittest discover -s scripts/tests -v
      - name: Установка закреплённых инструментов сборки
        run: python3 scripts/bootstrap.py --accept-licenses
      - name: Тесты, lint и неподписанный релиз
        run: bash scripts/gradle.sh :core:test :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :fixture:assembleDebug
      - name: Проверка APK и упаковка исходников
        run: |
          python3 scripts/check_repository.py --apk app/build/outputs/apk/release/app-release-unsigned.apk
          python3 scripts/package.py --apk app/build/outputs/apk/release/app-release-unsigned.apk --unsigned
      - name: Отчёты о проверках
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          path: |
            core/build/reports/
            core/build/test-results/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Неподписанный APK и исходники
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk-and-source
          path: |
            dist/*-unsigned.apk
            dist/*-source.zip
            dist/SHA256SUMS
          retention-days: 14
